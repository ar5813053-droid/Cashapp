name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install JS dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Configure Android SDK env
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platform-tools" >> "$GITHUB_PATH"

      - name: Accept licenses and ensure platform
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SM=$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          yes | "$SM" --licenses >/tmp/lic.txt 2>&1 || true
          "$SM" "platforms;android-35" "build-tools;35.0.0" "platform-tools" || \
          "$SM" "platforms;android-34" "build-tools;34.0.0" "platform-tools" || true

      - name: Expo prebuild
        run: npx expo prebuild --platform android --non-interactive --no-install

      - name: Patch release signing for sideload
        run: |
          python3 -c '
from pathlib import Path
p = Path("android/app/build.gradle")
t = p.read_text()
if "signingConfig signingConfigs.debug" not in t and "release {" in t:
    t = t.replace("release {", "release {\n            signingConfig signingConfigs.debug", 1)
    p.write_text(t)
    print("patched release signingConfig")
else:
    print("no patch needed or already present")
'

      - name: Build RELEASE APK with embedded JS
        working-directory: android
        env:
          NODE_ENV: production
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify bundle and package APK
        run: |
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "APK=$APK"
          ls -lh "$APK"
          unzip -l "$APK" | grep -iE 'bundle|index.android|assets/' | head -40 || true
          cp "$APK" PulsePay-standalone.apk

      - name: Upload standalone APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PulsePay-Standalone-APK
          path: PulsePay-standalone.apk
          if-no-files-found: error
          retention-days: 30
